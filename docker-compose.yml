services:

  api:
    build:
      context: .
      dockerfile: CursoIdiomasApp.Api/Dockerfile
    container_name: cursoidiomasapp-api
    restart: always
    depends_on:
      - sqlserver
    environment:
      ConnectionStrings__DefaultConnection: "Data Source=sqlserver,1433;Database=CursoIdiomasDb;User Id=sa;Password=Curso@2026;TrustServerCertificate=True;"
    ports:
      - "8082:8080"
    networks:
      - cursoidiomasapp-network 

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: CursoIdiomasApp.SqlServer
    restart: unless-stopped

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Curso@2026"

    ports:
      - "1435:1433"

    volumes:
      - curso_idiomas_sqlserver_data:/var/opt/mssql
    networks:
      - cursoidiomasapp-network

volumes:
  curso_idiomas_sqlserver_data:
  
networks:
  cursoidiomasapp-network:
    name: cursoidiomasapp-network
    driver: bridge